# Builds the iPhone app and today's market snapshot, then publishes both to GitHub Pages.
# The snapshot holds only PUBLIC data (market mood, plan picks, Learn links). Your holdings and
# wall never leave your phone, so nothing personal is ever built or published here.
name: Daily data + iPhone app

on:
  schedule:
    - cron: "40 22 * * 1-5" # weekdays 6:40pm New York (summer time), after the market close
    - cron: "15 13 * * 2-6" # next morning, after FRED posts the previous day's numbers
  workflow_dispatch: # "Run workflow" button on the Actions tab
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install (exact versions from the lockfiles)
        run: |
          uv --directory backend sync --frozen
          npm --prefix frontend ci --no-fund --no-audit

      - name: Test
        run: |
          uv --directory backend run --frozen pytest -q
          npm --prefix frontend run -s test

      - name: Build the iPhone app
        run: npm --prefix frontend run build:phone

      - name: Build today's snapshot
        env:
          # SEC asks every app to say who is reading. Stored as a repository secret, never in code.
          KL_SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: >
          uv --directory backend run --frozen python -m keystone_ledger.tools.snapshot
          --out ../frontend/dist-phone/snapshot.json
          --previous "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/snapshot.json"
          --verify-links

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist-phone

  deploy:
    needs: build
    # Only main publishes. A "Run workflow" on another branch is a dry run that still shows the
    # snapshot status table on the run page.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
