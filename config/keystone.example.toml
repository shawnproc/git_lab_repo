[screen]
revenue_years = 3                 # growth measured over this many years
min_revenue_cagr_pct = 5.0         # revenue growth per year, at least
min_operating_margin_pct = 12.0    # operating profit as % of sales, at least
margin_trend_tolerance_pp = 1.0    # margin may slip this much vs 2 years ago
require_positive_fcf = true
max_debt_to_operating_income = 3.0 # long-term debt / one year's operating profit
max_unavailable = 1                 # checks allowed to be "unavailable"
replace_after_failed_quarters = 2   # failed quarterly check-ins in a row before "replace" (1 = on watch)
valuation_pe_multiple = 1.5         # price flag when P/E is above 1.5x its own 5-year median

[drift]
max_abs_pp = 5.0             # flag if more than 5 percentage points off target
max_relative_pct = 25.0      # ...or more than 25% off its own target

[contribution]
fractional_shares = true   # false = whole shares + leftover cash

[mood]
index = "^GSPC"
ma_days = 200
vix_green_below = 20.0
vix_red_above = 30.0

[data]
price_provider = "yfinance"
macro_provider = "fred_csv"
fundamentals_provider = "sec_edgar"
history_years = 5
max_requests_per_second = 1.0
sec_requests_per_second = 5.0   # SEC allows 10/s
fundamentals_max_age_days = 30
