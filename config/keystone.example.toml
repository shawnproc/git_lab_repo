# Keystone Ledger plan. Copy to config/keystone.toml (git-ignored) to customize.
#
# * Read once at startup: restart the app after editing.
# * Every change is recorded (with a diff) in the config_audit table, visible at /api/config.
# * Hard limits enforced in code: no single stock above 10% of the portfolio; 1-3 core funds whose
#   weights must add up to core_pct; core_pct + stocks_pct = 100. A file that breaks them won't load.

[plan]
core_pct = 60.0          # broad index ETFs
stocks_pct = 40.0        # split equally across the stocks that pass the screen
max_stocks = 10
max_per_sector = 2       # so the picks can't all be tech
max_single_stock_pct = 8.0  # if fewer stocks pass, the excess goes to the core funds
reference_amount = 10000.0  # dollar targets use this until you enter holdings

[[plan.core_funds]]
symbol = "VTI"
name = "Vanguard Morningstar Total Stock Market ETF"
weight_pct = 45.0
why = "One fund that owns a small piece of nearly every public company in the US, big and small (it follows the Morningstar US Total Market Index, formerly called CRSP). It's the foundation of the plan: you don't have to pick winners, because you own them all."

[[plan.core_funds]]
symbol = "VXUS"
name = "Vanguard Total International Stock ETF"
weight_pct = 15.0
why = "One fund that owns thousands of companies outside the US, in places like Japan, Europe and Canada (it follows the FTSE Global All Cap ex US Index). It protects you if the US has a slow decade while other countries do well."

# Stocks to screen: symbol = sector. No banks/insurers/REITs (their financials don't fit the screen).
