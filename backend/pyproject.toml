[project]
name = "keystone-ledger"
version = "0.1.0"
description = "Personal, rules-based, paper-first trading decision aid. Educational tool, not financial advice."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
    "sqlalchemy==2.1.2",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "argon2-cffi==25.1.0",
    "pandas==3.0.6",
    "numpy==2.5.3",
    "yfinance==1.7.0",
    "httpx==0.28.1",
    "exchange-calendars==4.13.2",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.10",
    "mypy==2.4.0",
    "pip-audit==2.10.1",
    "pandas-stubs==3.0.5.260914",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keystone_ledger"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM", "RUF", "PL", "PT", "C4", "DTZ"]
# PLC0415: heavy libs (yfinance, exchange_calendars) are imported lazily on purpose.
ignore = ["PLR0913", "PLR0917", "PLR2004", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["yfinance.*", "exchange_calendars.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:keystone_ledger.*"]
